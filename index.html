<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کلمه‌ی پنهان | غذای ایرانی</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- صفحه اصلی -->
  <section id="home-screen" class="screen active">
    <div class="tile-pattern" aria-hidden="true"></div>
    <div class="ornament" aria-hidden="true"></div>

    <h1 class="title">کلمه‌ی پنهان</h1>
    <p class="subtitle">غذای ایرانی را پیدا کن</p>
    <p class="tagline">حروف را به ترتیب بکشید تا نام یک غذای خوشمزه ایرانی را کشف کنید.</p>

    <button id="play-btn" class="btn btn-primary" type="button">شروع بازی</button>
    <button id="levels-btn" class="btn btn-secondary" type="button">مراحل</button>
  </section>

  <!-- صفحه انتخاب مرحله -->
  <section id="levels-screen" class="screen">
    <h2 class="levels-title">انتخاب مرحله</h2>
    <div id="levels-grid" class="levels-grid"></div>
    <button id="back-to-home-btn" class="btn btn-secondary" type="button">بازگشت</button>
  </section>

  <!-- صفحه بازی -->
  <section id="game-screen" class="screen">
    <p class="level-indicator" id="level-indicator">مرحله ۱</p>
    <p class="instructions">حروف را به ترتیب روی دایره بکشید تا نام غذا را هجی کنید.</p>

    <div class="wheel" id="wheel">
      <svg class="trace" id="trace" viewBox="0 0 300 300">
        <polyline id="trace-line" points=""></polyline>
      </svg>
      <div class="wheel-center" aria-hidden="true"></div>
    </div>

    <p class="selection-display" id="selection-display" aria-live="polite">&nbsp;</p>
    <p class="feedback" id="feedback" aria-live="polite">&nbsp;</p>

    <button id="restart-btn" class="btn btn-secondary" type="button">از نو</button>
    <button id="back-to-levels-btn" class="btn btn-secondary" type="button">مراحل</button>
  </section>

  <!-- پیام برنده شدن -->
  <div id="win-overlay" class="overlay hidden">
    <div class="win-card">
      <p class="win-word" id="win-word" lang="fa"></p>
      <h2>آفرین!</h2>
      <p class="win-copy">شما این غذای خوشمزه را پیدا کردید.</p>
      <div class="win-actions">
        <button id="next-level-btn" class="btn btn-primary" type="button">مرحله بعد</button>
        <button id="win-back-to-levels-btn" class="btn btn-secondary" type="button">بازگشت به مراحل</button>
      </div>
    </div>
  </div>

  <!-- پیام تخفیف -->
  <div id="discount-overlay" class="overlay hidden">
    <div class="win-card discount-card">
      <h2>تبریک!</h2>
      <p class="discount-message">کد تخفیف ۵٪ برای سفارش غذای ایتالیایی</p>
      <button id="close-discount-btn" class="btn btn-primary" type="button">متوجه شدم</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
